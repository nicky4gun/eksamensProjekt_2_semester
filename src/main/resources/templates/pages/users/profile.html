<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profil | Deckforge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}" >
</head>
<body>
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="profile-layout">
        <section class="profile-panel">
            <h2>Profil</h2>

            <div class="profile-info">
                <p>Name: <span th:text="${user.firstName}"></span></p>
                <p>Last name: <span th:text="${user.lastName}"></span></p>
                <p>Username: <span th:text="${user.username}"></span></p>
            </div>
            <div class="profile-actions">
                <a href="/profile/update" class="btn btn-edit">Opdater profil</a>

                <form th:action="@{/profile/delete}" method="post"
                      onsubmit="return confirm('Are you sure you want to delete this user?')">
                    <button class="btn btn-delete" type="submit">Slet konto</button>
                </form>
            </div>
        </section>

        <section class="profile-content">
            <h2>Din samling</h2>
            <div class="card-grid">
                <div th:each="card : ${collection}" class="card">
                    <img th:src="@{'/images/' +${card.image}}" alt="card image">
                </div>
            </div>

            <div th:if="${deck != null}">
                <h2 th:text="${deck.deckName}"></h2>
                <p>Format: <span th:text="${deck.format}"></span></p>
            </div>

            <h2>Top Decks</h2>
            <div class="card-grid">
                <div th:each="card : ${cards}" class="card">
                    <img th:src="@{'/images/' +${card.image}}" alt="card image">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
