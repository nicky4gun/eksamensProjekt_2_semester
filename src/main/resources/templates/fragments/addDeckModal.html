<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<dialog th:fragment="addDeckModal(formatList)" id="newDeckModal">
    <button type="button" onclick="this.closest('dialog').close();
    this.closest('dialog').querySelector('form').reset()">&times;</button>
    <h2>Tilføj nyt Deck</h2>

    <form th:action="@{/decks/add}" method="post" class="deck-form">
        <input type="text" name="deckName" placeholder="Enter deck name here..." required>
        <select name="format" required>
            <option value="" disabled selected>Select Format</option>
            <option th:each="format : ${formatList}"
                    th:value="${format}"
                    th:text="${format.name}">
            </option>
        </select>
        <div class="modal-actions">
            <button type="button" onclick="this.closest('dialog').close();
            this.closest('dialog').querySelector('form').reset()" class="btn">Annuller</button>
            <button type="submit" class="btn">Opret Deck</button>
        </div>
    </form>
</dialog>

</body>
</html>
